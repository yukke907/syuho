<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache">
<title>株式会社太陽 資料をつくる</title>
<style>
  :root{
    --navy:#14284B; --header:#10233F; --bg:#F7F8FB; --panel:#FFF;
    --ink:#2E2E2E; --muted:#6D7684; --line:#E1E5EC;
    --orange:#F59E0B; --orange-d:#D98705; --green:#10B981; --red:#EF4444; --link:#2563EB;
    --green-bg:#E7F7F1; --amber-bg:#FDF3DE;
    --font:"Meiryo","メイリオ","Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    --mono:"SFMono-Regular",Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  html,body{overflow-x:hidden}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.7;font-size:16px;-webkit-text-size-adjust:100%;line-break:strict;overflow-wrap:break-word}
  textarea,.hint,label,.pv{word-break:auto-phrase}
  .app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:110px;overflow-x:hidden}
  .bar{position:sticky;top:0;z-index:20;background:var(--header);color:#fff;height:52px;padding:0 14px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 5px rgba(16,35,63,.2)}
  .bar .titlewrap{display:flex;flex-direction:column;justify-content:center;line-height:1.1;min-width:0}
  .bar .corp{font-size:11px;font-weight:700;color:#7FD3F2;letter-spacing:.02em}
  .bar .t{font-weight:700;font-size:17px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .back{background:none;border:none;color:#fff;font-size:26px;padding:0 4px;line-height:1}
  .pad{padding:12px 14px 0}

  .stepper{padding:10px 14px 0}
  .steptext{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:8px;display:flex;justify-content:space-between}
  .steptext .idx{color:var(--muted);font-weight:700}
  .stepbar{height:8px;background:#E1E5EC;border-radius:999px;overflow:hidden}
  .stepbar i{display:block;height:100%;background:var(--orange);border-radius:999px;transition:width .2s ease}

  .card{background:var(--panel);border-radius:8px;box-shadow:0 1px 3px rgba(16,35,63,.06);padding:12px;margin-bottom:8px}
  .grp{background:var(--panel);border-radius:8px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(16,35,63,.06)}
  .gh{font-size:15px;font-weight:700;color:var(--navy);padding:4px 0 6px;border-bottom:1px solid var(--line);margin-bottom:10px}
  label{display:block;font-size:15px;font-weight:700;color:var(--navy);margin:0 0 6px}
  input,textarea,select{width:100%;font-family:var(--font);font-size:16px;border:1px solid #CBD2DC;border-radius:6px;padding:11px 12px;min-height:48px;background:#fff;color:var(--ink)}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 2px rgba(20,40,75,.15)}
  textarea{resize:none;overflow:hidden;line-height:1.6}
  .fld{margin-bottom:11px}
  .hint{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.6}
  button{font-family:var(--font);cursor:pointer}

  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;background:var(--orange);color:#fff;border:none;border-radius:8px;font-size:17px;font-weight:700;padding:14px}
  .btn:active{background:var(--orange-d)}
  .btn.nav{background:#E2E6EC;color:var(--navy)}
  .btn.block{margin-top:12px}

  .hero{background:linear-gradient(135deg,#14284B,#26406e);color:#fff;border-radius:12px;padding:16px 16px;margin-bottom:4px}
  .hero-t{font-size:18px;font-weight:700}
  .hero-s{font-size:13px;color:#D7E0EF;margin-top:6px;line-height:1.7}

  .fab{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;padding:10px 14px 18px;background:transparent;z-index:15}
  .fab .rowbtn{display:flex;gap:12px}

  .savetoast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);background:var(--navy);color:#fff;padding:9px 18px;border-radius:22px;font-size:13.5px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:9999}
  .savetoast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ===== 資料をつくる（Canvaスライド用） ===== */
  .matpick{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:14px 14px;margin-bottom:10px;min-height:64px}
  .matpick:active{background:#F2F5F8}
  .matpick .ico{font-size:26px;line-height:1;flex:none;width:34px;text-align:center}
  .matpick .tx{min-width:0}
  .matpick .tt{font-size:15.5px;font-weight:700;color:var(--navy)}
  .matpick .ds{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.6}
  .matpick .chev{margin-left:auto;color:var(--muted);font-size:22px;flex:none}
  #matResult .rbox{width:100%;font-family:var(--mono);font-size:13px;line-height:1.7;border:1px solid #CBD2DC;border-radius:8px;padding:12px;background:#F7F8FB;color:var(--ink);min-height:220px;white-space:pre-wrap}
  .step3{counter-reset:st;margin:2px 0 6px;padding:0}
  .step3 li{list-style:none;position:relative;padding:6px 0 6px 34px;font-size:14px;color:var(--ink);line-height:1.6}
  .step3 li::before{counter-increment:st;content:counter(st);position:absolute;left:0;top:5px;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .matnote{background:var(--amber-bg);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--ink);line-height:1.7;margin-top:10px}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <button class="back" id="backBtn" style="display:none" onclick="matPrev()" aria-label="戻る">‹</button>
    <span class="titlewrap"><span class="corp">株式会社太陽</span><span class="t" id="barTitle">資料をつくる</span></span>
  </div>

  <div class="stepper" id="matStepper" style="display:none"><div class="steptext"><span id="matStepName"></span><span class="idx" id="matStepIdx"></span></div>
    <div class="stepbar"><i id="matFill"></i></div></div>

  <div class="pad"><div id="matBody"></div></div>
</div>

<div class="fab" id="fabMaterial" style="display:none"><div class="rowbtn">
  <button class="btn nav" id="matBackBtn" onclick="matPrev()">もどる</button>
  <button class="btn go" id="matNextBtn" onclick="matNext()">次へ →</button>
</div></div>

<script>
"use strict";

const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function ag(el){if(!el)return;el.style.height="auto";el.style.height=(el.scrollHeight+2)+"px";}
function saveToast(msg){let t=document.getElementById("saveToast");if(!t){t=document.createElement("div");t.id="saveToast";t.className="savetoast";document.body.appendChild(t);}t.textContent=msg;t.classList.add("show");clearTimeout(t.__to);t.__to=setTimeout(()=>t.classList.remove("show"),1400);}

/* ============================================================
   資料をつくる（Canvaスライド用のコピペ文を作成）
   ・案内どおり入力 → できた文を Claude Code に貼るだけ
   ============================================================ */
const PAGE_OPTS=["おまかせ","3〜5枚","6〜10枚","10枚以上"];
const TONE_OPTS=["おまかせ","きっちり・かっちり（社外・目上向け）","やわらかい・親しみ（提案・社内向け）"];

// role: title=題名 / to=相手 / subject=件名 / goal=目的 / pages / tone / それ以外=本文
const MAT_DEFS={
  taiyo:{
    label:"太陽シート提案資料（お客様向け）", icon:"☀️",
    intro:"太陽シートをお客様にすすめる提案資料をつくります。わかる範囲でOK。空欄は飛ばして大丈夫です。",
    steps:[
      {name:"基本", fields:[
        {k:"title", role:"title", label:"タイトル（表紙に出る題名）", def:"太陽シート ご提案", ph:"例：○○様邸 外壁リニューアルのご提案"},
        {k:"to",    role:"to",    label:"お客様名・物件名", ph:"例：○○マンション 管理組合 様"},
        {k:"goal",  role:"goal",  label:"この資料で伝えたいこと（ゴール）", type:"textarea", ph:"例：外壁の傷み対策として太陽シートを前向きに検討してもらう"},
      ]},
      {name:"内容", fields:[
        {k:"problem",  label:"今の困りごと・課題", type:"textarea", ph:"例：外壁のひび割れ・色あせ、雨漏りの不安、メンテ費用がかさむ"},
        {k:"merit",    label:"太陽シートで良くなること（メリット）", type:"textarea", ph:"例：見た目がきれいに／長持ちしてメンテが減る／建物を守れる"},
        {k:"spec",     label:"仕様・特長（わかる範囲で）", type:"textarea", ph:"例：耐候性シート、○年相当の耐久、色・柄が選べる"},
      ]},
      {name:"仕上げ", fields:[
        {k:"flow",  label:"施工の流れ・工期の目安", type:"textarea", ph:"例：現地調査→お見積→着工→完了（約○週間）"},
        {k:"cost",  label:"概算費用（任意）", ph:"例：○○万円〜（面積により変動）"},
        {k:"cases", label:"実績・事例（あれば）", type:"textarea", ph:"例：近隣の○○ビルで施工、△△の効果"},
        {k:"photo", label:"入れたい写真の説明（Canvaで後から追加）", type:"textarea", ph:"例：施工前後の写真、シートの色見本"},
        {k:"contact",label:"連絡先・担当", ph:"例：株式会社太陽 ○○（TEL 000-0000-0000）"},
        {k:"pages", role:"pages", label:"スライド枚数の目安", type:"select", opts:PAGE_OPTS},
        {k:"tone",  role:"tone",  label:"雰囲気（トーン）", type:"select", opts:TONE_OPTS},
      ]},
    ]},
  mitsumori:{
    label:"御見積のご説明資料", icon:"🧾",
    intro:"御見積の内容をお客様にわかりやすく説明する資料をつくります。金額の内訳を整理しておくとキレイに仕上がります。",
    steps:[
      {name:"基本", fields:[
        {k:"title",   role:"title",  label:"タイトル", def:"御見積書のご説明", ph:"例：○○工事 御見積のご説明"},
        {k:"to",      role:"to",     label:"宛先・お客様名", ph:"例：○○ 様"},
        {k:"subject", role:"subject",label:"件名（工事名）", ph:"例：外壁太陽シート施工工事"},
      ]},
      {name:"金額", fields:[
        {k:"items", label:"明細（「項目 / 数量 / 単価」を1行ずつ）", type:"textarea", ph:"例：\n太陽シート施工 / 120㎡ / 3,000円\n足場設置 / 一式 / 150,000円\n高圧洗浄 / 120㎡ / 300円"},
        {k:"extra", label:"諸経費・値引き（任意）", type:"textarea", ph:"例：諸経費 一式 50,000円／お値引き -30,000円"},
        {k:"total", label:"合計金額（税込）", ph:"例：770,000円（税込）"},
      ]},
      {name:"条件", fields:[
        {k:"terms",    label:"お支払い条件", type:"textarea", ph:"例：着工時50%・完了時50%／銀行振込"},
        {k:"deadline", label:"見積の有効期限", ph:"例：発行日より1ヶ月"},
        {k:"note",     label:"備考・特記事項（任意）", type:"textarea", ph:"例：追加工事が出た場合は別途お見積"},
        {k:"pages", role:"pages", label:"スライド枚数の目安", type:"select", opts:PAGE_OPTS},
        {k:"tone",  role:"tone",  label:"雰囲気（トーン）", type:"select", opts:TONE_OPTS},
      ]},
    ]},
  kikaku:{
    label:"社内の企画・報告資料", icon:"📈",
    intro:"社内の会議やプレゼンで使う、企画書・報告資料をつくります。",
    steps:[
      {name:"基本", fields:[
        {k:"title", role:"title", label:"タイトル", ph:"例：○○の業務改善のご提案"},
        {k:"to",    role:"to",    label:"だれに見せる資料か", def:"社内", ph:"例：役員会議、○○部"},
        {k:"goal",  role:"goal",  label:"目的・伝えたいこと（ゴール）", type:"textarea", ph:"例：新しい○○の導入を承認してもらう"},
      ]},
      {name:"内容", fields:[
        {k:"background", label:"背景・現状", type:"textarea", ph:"例：今こういう課題がある／数字が伸び悩んでいる"},
        {k:"data",       label:"実績・数字（あれば）", type:"textarea", ph:"例：売上前年比○%、○○件、コスト○円"},
        {k:"proposal",   label:"提案・企画の中身", type:"textarea", ph:"例：○○を導入し、△△の流れに変える"},
      ]},
      {name:"仕上げ", fields:[
        {k:"schedule", label:"スケジュール・進め方", type:"textarea", ph:"例：1ヶ月目 準備／2ヶ月目 試験導入／3ヶ月目 本運用"},
        {k:"effect",   label:"期待できる効果・まとめ", type:"textarea", ph:"例：作業時間○%削減、ミス低減"},
        {k:"pages", role:"pages", label:"スライド枚数の目安", type:"select", opts:PAGE_OPTS},
        {k:"tone",  role:"tone",  label:"雰囲気（トーン）", type:"select", opts:TONE_OPTS},
      ]},
    ]},
};

const MAT_KEY="taiyo-material-v1";
let matStore={};                 // {taiyo:{...}, mitsumori:{...}, kikaku:{...}}
let mat={type:null, steps:[], step:0, data:{}};

async function matLoadStore(){
  try{if(window.storage&&window.storage.get){const r=await window.storage.get(MAT_KEY,false);if(r&&r.value){matStore=JSON.parse(r.value)||{};return;}}}catch(e){}
  try{const v=localStorage.getItem(MAT_KEY);if(v){matStore=JSON.parse(v)||{};return;}}catch(e){}
  try{if(window.__matmem)matStore=JSON.parse(window.__matmem)||{};}catch(e){}
}
async function matSaveStore(){
  const data=JSON.stringify(matStore);
  try{localStorage.setItem(MAT_KEY,data);}catch(e){}
  try{if(window.storage&&window.storage.set){await window.storage.set(MAT_KEY,data,false);}}catch(e){}
  try{window.__matmem=data;}catch(e){}
}

function matPickType(t){
  const def=MAT_DEFS[t]; if(!def)return;
  mat.type=t; mat.steps=def.steps; mat.step=0;
  mat.data=Object.assign({}, matStore[t]||{});
  def.steps.forEach(s=>s.fields.forEach(f=>{ if(f.def&&(mat.data[f.k]==null||mat.data[f.k]==="")) mat.data[f.k]=f.def; }));
  matRender();
}

function matField(f){
  const v=mat.data[f.k]||"";
  const hint=f.hint?`<div class="hint">${esc(f.hint)}</div>`:"";
  let ctrl;
  if(f.type==="select"){
    ctrl=`<select id="m_${f.k}">`+f.opts.map(o=>`<option${o===v?" selected":""}>${esc(o)}</option>`).join("")+`</select>`;
  }else if(f.type==="textarea"){
    ctrl=`<textarea id="m_${f.k}" rows="3" placeholder="${esc(f.ph||"")}">${esc(v)}</textarea>`;
  }else{
    ctrl=`<input id="m_${f.k}" type="text" placeholder="${esc(f.ph||"")}" value="${esc(v)}">`;
  }
  return `<div class="fld"><label>${esc(f.label)}</label>${ctrl}${hint}</div>`;
}

function matRender(){
  const stepper=document.getElementById("matStepper");
  const fab=document.getElementById("fabMaterial");
  const back=document.getElementById("matBackBtn");
  const next=document.getElementById("matNextBtn");
  const topBack=document.getElementById("backBtn");
  const title=document.getElementById("barTitle");
  const body=document.getElementById("matBody");

  // 1) 種類えらび
  if(!mat.type){
    stepper.style.display="none"; fab.style.display="none"; topBack.style.display="none";
    title.textContent="資料をつくる";
    const btn=t=>{const d=MAT_DEFS[t];return `<button class="matpick" onclick="matPickType('${t}')"><span class="ico">${d.icon}</span><span class="tx"><span class="tt">${esc(d.label)}</span><span class="ds">${esc(d.intro)}</span></span><span class="chev">›</span></button>`;};
    body.innerHTML=`<div class="hero"><div class="hero-t">📊 資料をつくる（Canvaスライド）</div>
        <div class="hero-s">案内どおり入力するだけ。できた文を Claude Code に貼ると、Canva スライドになります。</div></div>
      <div class="grp"><div class="gh">どんな資料をつくりますか？</div>
      <div class="hint" style="margin:0 0 12px">つくりたいものを1つえらんでください。</div>
      ${btn("taiyo")}${btn("mitsumori")}${btn("kikaku")}</div>`;
    window.scrollTo(0,0); return;
  }

  fab.style.display=""; next.style.display=""; topBack.style.display="";
  const total=mat.steps.length+1;               // 入力ステップ + 仕上がり
  const isResult=(mat.step>=mat.steps.length);
  stepper.style.display="";
  title.textContent=isResult?"できあがり":"資料をつくる";
  document.getElementById("matStepName").textContent=isResult?"できあがり":MAT_DEFS[mat.type].label.replace(/（.*/,"")+"・"+mat.steps[mat.step].name;
  document.getElementById("matStepIdx").textContent=`${mat.step+1} / ${total}`;
  document.getElementById("matFill").style.width=Math.round((mat.step+1)/total*100)+"%";
  back.textContent="もどる";

  // 2) 仕上がり（コピペ文）
  if(isResult){
    next.textContent="Claude Code用にコピー";
    const text=buildMatPrompt();
    body.innerHTML=`<div id="matResult">
      <div class="grp"><div class="gh">① できた文をコピー</div>
        <textarea class="rbox" id="matOut" readonly>${esc(text)}</textarea>
        <button class="btn block" onclick="matCopy()" style="margin-top:10px">この文をコピーする</button>
      </div>
      <div class="grp"><div class="gh">② Claude Code に貼るだけ</div>
        <ol class="step3">
          <li>スマホ／パソコンで <b>Claude Code</b> をひらく</li>
          <li>いま「コピー」した文を、そのまま <b>貼り付け</b>て送る</li>
          <li>あとは AI が1つずつ案内。<b>構成案でOK</b>を出すと、Canva のスライドができます</li>
        </ol>
        <div class="matnote">💡 はじめての時だけ、Canva との「連携（つなぐ設定）」を AI が案内します。むずかしい言葉が出たら「初心者にもわかるように」と伝えればOK。<br>できたスライドは Canva 上で、写真や飾りをあとから足せます。</div>
      </div></div>`;
    window.scrollTo(0,0); return;
  }

  // 3) 入力ステップ
  next.textContent="次へ →";
  const st=mat.steps[mat.step];
  body.innerHTML=`<div class="grp"><div class="gh">${esc(MAT_DEFS[mat.type].label)}</div>
      <div class="hint" style="margin:0 0 4px">${esc(MAT_DEFS[mat.type].intro)}</div></div>
    <div class="grp">${st.fields.map(matField).join("")}</div>`;
  window.scrollTo(0,0);
  setTimeout(()=>document.querySelectorAll("#matBody textarea").forEach(ag),20);
}

function matCollect(){
  if(!mat.type||mat.step>=mat.steps.length)return;
  mat.steps[mat.step].fields.forEach(f=>{ const e=document.getElementById("m_"+f.k); if(e)mat.data[f.k]=e.value; });
  matStore[mat.type]=Object.assign({}, mat.data);
  matSaveStore();
}

function matNext(){
  if(!mat.type)return;
  if(mat.step>=mat.steps.length){ matCopy(); return; }     // 仕上がり画面
  matCollect();
  if(mat.step===0){
    const tk=mat.steps[0].fields.find(f=>f.role==="title");
    if(tk && !(mat.data[tk.k]||"").trim()){ alert("タイトルを入れてください。"); return; }
  }
  mat.step++; matRender();
}

function matPrev(){
  if(!mat.type){ return; }                                 // 種類えらびが先頭（戻り先なし）
  matCollect();
  if(mat.step<=0){ mat.type=null; matRender(); return; }    // 種類えらびへ
  mat.step--; matRender();
}

function matVal(k){ return (mat.data[k]||"").trim(); }
function matLine(label,v){ v=(v||"").trim(); return v?`【${label}】${v}\n`:""; }
function matSec(label,v){ v=(v||"").trim(); return v?`● ${label}\n${v}\n\n`:""; }

function buildMatPrompt(){
  const def=MAT_DEFS[mat.type];
  const g={}; // role -> value
  def.steps.forEach(s=>s.fields.forEach(f=>{ if(f.role)g[f.role]=matVal(f.k); }));
  const title=g.title||def.label;
  const to=g.to||""; const subject=g.subject||""; const goal=g.goal||"";
  const pages=g.pages||"おまかせ"; const tone=g.tone||"おまかせ";

  let h="";
  h+=`テーマ：${title}\n\n`;
  h+=`Claude Code と Canva を連携して、下の内容でスライド資料を作り、Canva であとから編集できる形で納品してください。\n\n`;
  h+=`・Canva と未連携なら、まず連携（つなぐ設定）から。専門用語を使わず1つずつ案内して、接続できたことを確認してから次へ進んでください\n`;
  h+=`・準備ができたら、まず「構成案（各スライドの見出し）」を見せてください。私がOKしたらスライド作成へ進んでください\n`;
  h+=`・文章は、下の内容をもとに読みやすく整えてください（事実ベースで、盛りすぎないでください）\n`;
  h+=`・写真や飾りを入れたい所は、最後に私が Canva 上で足せるよう、目印（プレースホルダー）を置いてください\n`;
  h+=`・私は AI 初心者です。迷ったら、おすすめで進めてください\n`;
  h+=`\n――――――――――\n`;
  h+=matLine("資料の種類",def.label);
  h+=matLine(mat.type==="kikaku"?"見せる相手":"相手・お客様",to);
  h+=matLine("件名",subject);
  h+=matLine("ゴール",goal);
  h+=matLine("スライド枚数の目安",pages);
  h+=matLine("雰囲気（トーン）",tone);
  h+=`――――――――――\n\n■ 盛り込みたい内容\n\n`;

  let b="";
  def.steps.forEach(s=>s.fields.forEach(f=>{ if(!f.role) b+=matSec(f.label.replace(/（.*?）/g,""), matVal(f.k)); }));
  if(!b.trim()) b="（内容はおまかせで、上のテーマとゴールに合う一般的な構成で作ってください）\n";
  return (h+b).trim()+"\n";
}

function matCopy(){
  const text=buildMatPrompt();
  const done=()=>{ saveToast("コピーしました。Claude Code に貼り付けてください"); };
  const fallback=()=>{ const ta=document.getElementById("matOut"); if(ta){ta.removeAttribute("readonly");ta.focus();ta.select();try{document.execCommand("copy");done();}catch(e){alert("コピーできませんでした。文を選択してコピーしてください。");}ta.setAttribute("readonly","");} else {alert("コピーできませんでした。");} };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done).catch(fallback); }
  else { fallback(); }
}

document.addEventListener("input",e=>{if(e.target&&e.target.tagName==="TEXTAREA")ag(e.target);});
(async()=>{await matLoadStore();matRender();})();
</script>
